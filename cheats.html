<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameZone · Cheats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-gamepad"></i> GameZone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="cheats.html" class="active">Cheats</a>
      <a href="about.html">About</a>
    </nav>
  </header>
  <div class="container">
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Search cheats by game name..." oninput="filterCards(this.value)">
    </div>
    <div class="cheats-layout">
      <div id="cheats-main-content" class="main-cheats-content">
        <h1>Game Cheats</h1>
        <p>Select a game below to find instant cheat codes.</p>
        <div class="grid" id="cheats-games-grid"></div>
      </div>
      <aside class="related-sidebar">
        <h3>All Game Cheats</h3>
        <ul class="related-list" id="related-games-list"></ul>
      </aside>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
