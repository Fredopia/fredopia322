<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone - Cheats Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎮 Master Cheats Database</h1>
    <p>Search or select a game below to see working codes:</p>

    <div class="controls">
        <!-- Live Real Search Bar Input Element -->
        <input type="text" id="search-bar" class="search-box" placeholder="🔍 Search games...">
        
        <!-- The JavaScript will automatically insert game choices here -->
        <select id="game-selector">
            <option value="">-- Choose a Game --</option>
        </select>
    </div>

    <!-- Container for Game Cards Grid on Cheats page if needed -->
    <div id="cheats-games-grid"></div>

    <!-- The JavaScript will automatically display cheats here -->
    <div id="cheats-container"></div>

    <!-- Link your background execution engine -->
    <script src="script.js"></script>
</body>
</html>
