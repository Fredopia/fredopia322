<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone - Cheats Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 30px; text-align: center; }
        h1 { color: #00ffcc; }
        .controls { margin-bottom: 30px; }
        select { background-color: #1f1f1f; color: #00ffcc; border: 2px solid #00ffcc; padding: 10px 20px; font-size: 16px; border-radius: 5px; outline: none; cursor: pointer; }
        #cheats-container { max-width: 600px; margin: 0 auto; text-align: left; }
        .cheat-card { background-color: #1f1f1f; border-left: 5px solid #00ffcc; padding: 15px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .cheat-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #ffffff; }
        .cheat-code { display: inline-block; background-color: #333333; color: #ff007f; font-family: monospace; padding: 4px 8px; border-radius: 4px; font-size: 16px; font-weight: bold; margin-bottom: 8px; border: 1px solid #555; }
        .cheat-desc { color: #aaaaaa; font-size: 14px; margin: 0; }
    </style>
</head>
<body>

    <h1>🎮 Master Cheats Database</h1>
    <p>Select a game below to see working codes:</p>

    <div class="controls">
        <!-- The JavaScript will automatically insert game choices here -->
        <select id="game-selector">
            <option value="">-- Choose a Game --</option>
        </select>
    </div>

    <!-- The JavaScript will automatically display cheats here -->
    <div id="cheats-container"></div>

    <!-- Link your background execution engine -->
    <script src="script.js"></script>
</body>
</html>
