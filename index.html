<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameZone · Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ---------- SHARED STYLES (copy to all pages) ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0b0e; color: #f0f0f5; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: #7affb0; text-decoration: none; transition: 0.2s; }

    header {
      background: rgba(16, 16, 22, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #2a2a32;
      padding: 14px 5%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a0ffd0, #3aff92);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i { -webkit-text-fill-color: initial; color: #3aff92; font-size: 2rem; }
    nav { display: flex; flex-wrap: wrap; gap: 6px 18px; }
    nav a {
      font-weight: 600;
      font-size: 1rem;
      padding: 6px 0;
      color: #b0b0c0;
      border-bottom: 2px solid transparent;
      transition: 0.25s;
    }
    nav a:hover, nav a.active { color: #7affb0; border-bottom-color: #7affb0; }

    .container { max-width: 1280px; margin: 0 auto; padding: 28px 20px 50px; width: 100%; flex: 1; }

    /* home hero */
    .hero-banner {
      background: radial-gradient(circle at 20% 30%, #1b2a24, #0e1217);
      border: 1px solid #2b3d33;
      border-radius: 40px;
      padding: 2.8rem 2rem;
      margin-bottom: 40px;
      text-align: center;
      box-shadow: 0 16px 40px -8px rgba(0,255,136,0.08);
    }
    .hero-banner h2 {
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 700;
      background: linear-gradient(to right, #d0fff0, #7affb0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .hero-banner p { max-width: 640px; margin: 8px auto 28px; color: #bfcfd0; font-size: 1.15rem; }
    .hero-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 24px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 36px;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 60px;
      border: none;
      background: #2b2b36;
      color: #fff;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      min-width: 180px;
    }
    .btn i { font-size: 1.2rem; }
    .btn-accent {
      background: #1f2e28;
      color: #d5ffec;
      border: 1px solid #3aff92;
      box-shadow: 0 0 12px rgba(58,255,146,0.2);
      position: relative;
      overflow: hidden;
    }
    .btn-accent::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 60px;
      padding: 2px;
      background: conic-gradient(from 0deg, #3aff92, #a0f0c0, #3aff92, #a0f0c0, #3aff92);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotate-border 3s linear infinite;
      pointer-events: none;
    }
    @keyframes rotate-border { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn-accent:hover { background: #1f3a30; transform: scale(1.02); box-shadow: 0 0 30px rgba(58,255,146,0.5); }
    .btn-dark { background: #1e1e28; border: 1px solid #3a3a4a; color: #e0e0ee; }
    .btn-dark:hover { background: #2c2c3a; border-color: #7affb0; }

    .search-container { margin-bottom: 32px; }
    .search-bar {
      width: 100%;
      padding: 16px 24px;
      background: #16161e;
      border: 1px solid #2d2d3a;
      border-radius: 60px;
      color: #f0f0f5;
      font-size: 1rem;
      outline: none;
      transition: 0.25s;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    .search-bar:focus { border-color: #3aff92; box-shadow: 0 0 20px rgba(58,255,146,0.15), inset 0 2px 6px rgba(0,0,0,0.4); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin: 16px 0 28px;
    }
    .card {
      background: #13131b;
      border: 1px solid #262633;
      border-radius: 28px;
      padding: 22px 20px 20px;
      display: flex;
      flex-direction: column;
      transition: 0.25s;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    .card:hover { transform: translateY(-6px); border-color: #3aff92; box-shadow: 0 16px 30px -8px rgba(58,255,146,0.12); }
    .card h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; color: #eef5f0; }
    .card p { color: #a0b0aa; font-size: 0.9rem; }
    .card .btn { margin-top: 20px; padding: 12px 16px; font-size: 0.95rem; min-width: unset; width: 100%; }

    .section-title { font-size: 1.8rem; font-weight: 600; margin: 30px 0 14px; color: #d0f0e0; }

    /* about box */
    .about-box { background: #13131b; border: 1px solid #262633; border-radius: 32px; padding: 32px 28px; }
    .highlight-text { color: #7affb0; font-weight: 600; }

    @media (max-width: 480px) {
      header { flex-direction: column; align-items: stretch; gap: 8px; }
      nav { justify-content: center; }
      .btn { min-width: 140px; padding: 14px 24px; font-size: 1rem; }
      .hero-buttons { flex-direction: column; align-items: center; }
      .hero-buttons .btn { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-gamepad"></i> GameZone</div>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="games.html">Games</a>
      <a href="cheats.html">Cheats</a>
      <a href="about.html">About</a>
    </nav>
  </header>
  <div class="container">
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Search games or cheats..." id="globalSearch" oninput="filterCards(this.value)">
    </div>
    <div class="hero-banner">
      <h2>Your Ultimate Gaming Hub</h2>
      <p>Download full games free &amp; access the largest cheat database.</p>
      <div class="hero-buttons">
        <a href="games.html" class="btn btn-accent"><i class="fas fa-rocket"></i> Browse Downloads</a>
        <a href="cheats.html" class="btn btn-dark"><i class="fas fa-bolt"></i> Find Cheats</a>
      </div>
    </div>
    <h2 class="section-title">Featured Games</h2>
    <div class="grid" id="featured-grid">
      <!-- sample cards will be injected by JS -->
    </div>
  </div>
  <script>
    const gameData = [
      { name: "Cyber Rush 2026", type: "Action / Sci-Fi", size: "45 GB" },
      { name: "Shadow Ninja: Vengeance", type: "Stealth / RPG", size: "12 GB" },
      { name: "Speed Horizon Tracker", type: "Racing / Simulation", size: "28 GB" }
    ];
    const grid = document.getElementById('featured-grid');
    grid.innerHTML = gameData.map(g => `
      <div class="card" data-name="${g.name.toLowerCase()}">
        <div><h3>${g.name}</h3><p>${g.type}</p><p style="font-size:0.8rem; color:#7a8a82;">${g.size}</p></div>
        <a href="games.html" class="btn btn-dark"><i class="fas fa-download"></i> Download</a>
      </div>
    `).join('');

    window.filterCards = function(val) {
      const q = val.toLowerCase().trim();
      document.querySelectorAll('.card[data-name]').forEach(c => {
        c.style.display = c.getAttribute('data-name').includes(q) ? 'flex' : 'none';
      });
    };
  </script>
</body>
</html>
